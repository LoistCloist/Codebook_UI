services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: codebook
      POSTGRES_PASSWORD: codebook
      POSTGRES_DB: codebook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebook -d codebook"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
